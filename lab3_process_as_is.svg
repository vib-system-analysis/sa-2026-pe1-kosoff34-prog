<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1120" viewBox="0 0 3200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Проверка и согласование договора до подписания, процесс as-is</title>
  <desc id="desc">BPMN-модель процесса с дорожками владельца бизнеса, юриста и контрагента. Показаны проверка договора, условная консультация, обмен замечаниями и цикл перепроверки новой редакции.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#405466"/></marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #172A3A; }
      .lane { fill: #fff; stroke: #9BAAB5; stroke-width: 2; }
      .lanehead { fill: #F4F7F9; }
      .lane-label { font-size: 15px; font-weight: 700; fill: #294559; letter-spacing: 1px; }
      .task { fill: #fff; stroke: #426579; stroke-width: 2.5; }
      .task-soft { fill: #EAF2F6; stroke: #426579; stroke-width: 2.5; }
      .task-green { fill: #F1F8F5; stroke: #27856A; stroke-width: 2.5; }
      .task-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .gateway { fill: #FFF4D6; stroke: #B88725; stroke-width: 2.5; }
      .gateway-text { font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
      .flow { fill: none; stroke: #405466; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-label { font-size: 13px; fill: #405466; text-anchor: middle; }
      .event-start { fill: #fff; stroke: #27856A; stroke-width: 4; }
      .event-end { fill: #fff; stroke: #27856A; stroke-width: 5; }
    </style>
  </defs>
  <rect width="3200" height="1120" fill="#fff"/>
  <text x="30" y="56" font-size="28" font-weight="700">Проверка и согласование договора до подписания (as-is)</text>
  <rect class="lane" x="30" y="100" width="3140" height="410"/>
  <rect class="lanehead" x="30" y="100" width="3140" height="38"/>
  <path d="M30 138H3170" stroke="#9BAAB5" stroke-width="2"/>
  <text class="lane-label" x="55" y="126">ВЛАДЕЛЕЦ БИЗНЕСА</text>
  <rect class="lane" x="30" y="510" width="3140" height="225"/>
  <rect class="lanehead" x="30" y="510" width="3140" height="38"/>
  <path d="M30 548H3170" stroke="#9BAAB5" stroke-width="2"/>
  <text class="lane-label" x="55" y="536">ЮРИСТ / КОНСУЛЬТАНТ</text>
  <rect class="lane" x="30" y="735" width="3140" height="330"/>
  <rect class="lanehead" x="30" y="735" width="3140" height="38"/>
  <path d="M30 773H3170" stroke="#9BAAB5" stroke-width="2"/>
  <text class="lane-label" x="55" y="761">КОНТРАГЕНТ</text>

  <path class="flow" d="M294 292H330"/>
  <path class="flow" d="M480 289H530"/>
  <path class="flow" d="M720 289H780"/>
  <path class="flow" d="M812 257V190H900"/>
  <text class="flow-label" x="853" y="181">нет</text>
  <path class="flow" d="M1055 190H1120"/>
  <text class="flow-label" x="1087" y="180">решение подписать</text>
  <path class="flow" d="M844 289H872V379H900"/>
