  <text class="flow-label" x="2500" y="874">новая редакция</text>
  <path class="flow" d="M2612 845V500H2625V328"/>
  <text class="flow-label" x="2638" y="486" transform="rotate(-90 2638 486)">договор с изменениями</text>
  <path class="flow" d="M2720 289H2760"/>
  <path class="flow" d="M2792 257V190H2860"/>
  <text class="flow-label" x="2825" y="181">да</text>
  <path class="flow" d="M3010 190H3070"/>
  <text class="flow-label" x="3040" y="180">подписанный договор</text>
  <path class="flow" d="M2792 321V389H2850"/>
  <text class="flow-label" x="2822" y="375">нет</text>
  <path class="flow" d="M2950 428V700H1830V845"/>
  <text class="flow-label" x="2380" y="690">дополнительные замечания: повторный цикл</text>

  <circle class="event-start" cx="272" cy="292" r="22"/>
  <rect class="task" x="330" y="250" width="150" height="78" rx="8"/>
  <text class="task-text" x="405" y="282"><tspan x="405">Получить договор</tspan><tspan x="405" dy="21">и приложения</tspan></text>
  <rect class="task" x="530" y="250" width="190" height="78" rx="8"/>
  <text class="task-text" x="625" y="282"><tspan x="625">Прочитать и сверить</tspan><tspan x="625" dy="21">с типовыми условиями</tspan></text>
  <polygon class="gateway" points="812,257 844,289 812,321 780,289"/>
  <text class="gateway-text" x="812" y="280"><tspan x="812">Есть спорные</tspan><tspan x="812" dy="16">условия?</tspan></text>
  <rect class="task-green" x="900" y="155" width="155" height="70" rx="8"/>
  <text class="task-text" x="977" y="182"><tspan x="977">Принять условия</tspan><tspan x="977" dy="21">без замечаний</tspan></text>
  <circle class="event-end" cx="1142" cy="190" r="22"/>
  <rect class="task" x="900" y="340" width="190" height="78" rx="8"/>
  <text class="task-text" x="995" y="372"><tspan x="995">Выделить риски</tspan><tspan x="995" dy="21">и подготовить вопросы</tspan></text>
  <polygon class="gateway" points="1167,347 1199,379 1167,411 1135,379"/>
  <text class="gateway-text" x="1167" y="373"><tspan x="1167">Нужна</tspan><tspan x="1167" dy="16">консультация?</tspan></text>
  <rect class="task" x="1245" y="565" width="210" height="86" rx="8" fill="#F4F7F9"/>
  <text class="task-text" x="1350" y="598"><tspan x="1350">Разобрать вопросы</tspan><tspan x="1350" dy="21">и дать рекомендацию</tspan></text>
  <rect class="task" x="1480" y="340" width="170" height="78" rx="8"/>
  <text class="task-text" x="1565" y="372"><tspan x="1565">Уточнить замечания</tspan><tspan x="1565" dy="21">по совету юриста</tspan></text>
  <rect class="task-soft" x="1715" y="340" width="180" height="78" rx="8"/>
  <text class="task-text" x="1805" y="372"><tspan x="1805">Отправить протокол</tspan><tspan x="1805" dy="21">замечаний</tspan></text>

  <rect class="task" x="1740" y="845" width="180" height="78" rx="8"/>
  <text class="task-text" x="1830" y="884">Рассмотреть протокол</text>
  <polygon class="gateway" points="1987,852 2019,884 1987,916 1955,884"/>
  <text class="gateway-text" x="1987" y="878"><tspan x="1987">Готов менять</tspan><tspan x="1987" dy="16">условия?</tspan></text>
  <rect class="task" x="2070" y="775" width="190" height="78" rx="8"/>
  <text class="task-text" x="2165" y="807"><tspan x="2165">Согласовать</tspan><tspan x="2165" dy="21">часть изменений</tspan></text>
  <rect class="task" x="2070" y="940" width="190" height="78" rx="8"/>
  <text class="task-text" x="2165" y="972"><tspan x="2165">Обсудить спорные</tspan><tspan x="2165" dy="21">условия</tspan></text>
  <rect class="task" x="2310" y="845" width="170" height="78" rx="8"/>
  <text class="task-text" x="2395" y="877"><tspan x="2395">Подготовить новую</tspan><tspan x="2395" dy="21">редакцию</tspan></text>
  <rect class="task-soft" x="2520" y="845" width="185" height="78" rx="8"/>
  <text class="task-text" x="2612" y="877"><tspan x="2612">Передать новую</tspan><tspan x="2612" dy="21">редакцию владельцу</tspan></text>

  <rect class="task" x="2530" y="250" width="190" height="78" rx="8"/>
  <text class="task-text" x="2625" y="282"><tspan x="2625">Сверить изменённые</tspan><tspan x="2625" dy="21">пункты</tspan></text>
  <polygon class="gateway" points="2792,257 2824,289 2792,321 2760,289"/>
  <text class="gateway-text" x="2792" y="282"><tspan x="2792">Условия</tspan><tspan x="2792" dy="16">приемлемы?</tspan></text>
  <rect class="task-green" x="2860" y="155" width="150" height="70" rx="8"/>
  <text class="task-text" x="2935" y="182"><tspan x="2935">Подписать</tspan><tspan x="2935" dy="21">договор</tspan></text>
  <circle class="event-end" cx="3092" cy="190" r="22"/>
  <rect class="task-soft" x="2850" y="350" width="200" height="78" rx="8"/>
  <text class="task-text" x="2950" y="382"><tspan x="2950">Отправить дополнительные</tspan><tspan x="2950" dy="21">замечания</tspan></text>

  <text x="30" y="1100" font-size="14" fill="#526675">Круг — начало/конец · Скруглённый прямоугольник — действие · Ромб — развилка · Подписи стрелок — передаваемые документы или решения</text>
</svg>